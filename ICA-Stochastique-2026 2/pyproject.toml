[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ica-stoch"
version = "1.0.0"
description = "ICA et optimisation stochastique : comparaison d'algorithmes et PICA sur IRM fonctionnelle"
authors = [{ name = "Sarah Eliko" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.3",
    "mne>=1.6",
    "nilearn>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
